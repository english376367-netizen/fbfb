<script>
const qs=[{"no": 1, "q": "It took Lan two hours to finish her homework.", "prompt": "Lan spent ______________________________.", "answer": "Lan spent two hours finishing her homework.", "structure": "spend + time + V-ing", "explanation": "“It takes + time” có thể đổi thành “spend + time + V-ing” mà nghĩa không đổi."}, {"no": 2, "q": "Do you understand this grammar rule?", "prompt": "Are you ______________________________?", "answer": "Are you aware of this grammar rule?", "structure": "be aware of", "explanation": "“understand” có thể diễn đạt bằng “be aware of”."}, {"no": 3, "q": "She likes reading books.", "prompt": "She is ______________________________.", "answer": "She is interested in reading books.", "structure": "be interested in + V-ing", "explanation": "“like” có thể đổi thành “be interested in + V-ing”."}, {"no": 4, "q": "He stayed home because he was sick.", "prompt": "He stayed home ______________________________.", "answer": "He stayed home because of his illness.", "structure": "because of + noun", "explanation": "Sau “because” là mệnh đề; sau “because of” là danh từ/cụm danh từ."}, {"no": 5, "q": "Although the weather was bad, we went out.", "prompt": "Despite ______________________________, we went out.", "answer": "Despite the bad weather, we went out.", "structure": "despite + noun", "explanation": "“Although + mệnh đề” có thể đổi thành “Despite + danh từ/cụm danh từ”."}, {"no": 6, "q": "We succeeded in solving the problem.", "prompt": "We ______________________________ the problem.", "answer": "We managed to solve the problem.", "structure": "manage to + V", "explanation": "“succeed in V-ing” có thể đổi thành “manage to V”."}, {"no": 7, "q": "The box is too heavy for me to carry.", "prompt": "The box is ______________________________.", "answer": "The box is not light enough for me to carry.", "structure": "not + adjective + enough + to V", "explanation": "Dùng cấu trúc “not + adjective + enough + to V” để diễn đạt “không đủ... để...”."}, {"no": 8, "q": "I prefer you to stay here.", "prompt": "I would rather ______________________________.", "answer": "I would rather you stayed here.", "structure": "would rather + subject + past verb", "explanation": "“prefer somebody to V” có thể đổi thành “would rather somebody + V quá khứ”."}, {"no": 9, "q": "She prefers staying home to going out.", "prompt": "She’d rather ______________________________.", "answer": "She’d rather stay home than go out.", "structure": "would rather + V + than + V", "explanation": "“prefer V-ing to V-ing” tương đương “would rather V than V”."}, {"no": 10, "q": "I can swim across this river.", "prompt": "I am ______________________________.", "answer": "I am able to swim across this river.", "structure": "be able to + V", "explanation": "“can + V” có thể đổi thành “be able to + V”."}, {"no": 11, "q": "As soon as I arrived, the meeting started.", "prompt": "Hardly ______________________________.", "answer": "Hardly had I arrived when the meeting started.", "structure": "Hardly had + S + V3 + when + S + V2", "explanation": "“Hardly had + S + V3 when + S + V2” diễn tả hai việc xảy ra liên tiếp."}, {"no": 12, "q": "I don’t live here anymore.", "prompt": "I ______________________________ here.", "answer": "I no longer live here.", "structure": "no longer + inversion / no longer + V", "explanation": "“not ... anymore” có thể đổi thành “no longer”."}, {"no": 13, "q": "She never complained about the work.", "prompt": "At no time ______________________________.", "answer": "At no time did she complain about the work.", "structure": "At no time + inversion", "explanation": "“At no time” mang nghĩa phủ định và thường đi với đảo ngữ."}, {"no": 14, "q": "This old computer is not worth repairing.", "prompt": "There ______________________________ this old computer.", "answer": "There is no point in repairing this old computer.", "structure": "there is no point in + V-ing", "explanation": "“not worth” có thể đổi thành “there is no point in + V-ing”."}, {"no": 15, "q": "It isn’t worth arguing with him.", "prompt": "There ______________________________ with him.", "answer": "There is no point in arguing with him.", "structure": "there is no point in + V-ing", "explanation": "“not worth doing” tương đương “there is no point in doing”."}, {"no": 16, "q": "It seems that Tom will be late.", "prompt": "Tom ______________________________ late.", "answer": "Tom is likely to be late.", "structure": "be likely to + V", "explanation": "“It seems that...” có thể đổi thành “S + be likely to V”."}, {"no": 17, "q": "Although he was tired, he continued working.", "prompt": "Despite ______________________________, he continued working.", "answer": "Despite being tired, he continued working.", "structure": "despite + gerund", "explanation": "“Although + clause” có thể đổi thành “Despite + V-ing” khi hai chủ ngữ phù hợp."}, {"no": 18, "q": "The soup has a wonderful taste.", "prompt": "The soup ______________________________.", "answer": "The soup is delicious.", "structure": "be + adjective", "explanation": "Có thể đổi cấu trúc “S + V + N” sang “S + be + adjective” khi nghĩa tương đương."}, {"no": 19, "q": "The teacher is helpful to us.", "prompt": "The teacher ______________________________ us.", "answer": "The teacher helps us.", "structure": "verb + object", "explanation": "Có thể đổi “S + be + adjective” sang động từ phù hợp mà vẫn giữ nghĩa."}, {"no": 20, "q": "She is accustomed to getting up early.", "prompt": "She is ______________________________ early.", "answer": "She is used to getting up early.", "structure": "be used to + V-ing", "explanation": "“be accustomed to + V-ing” tương đương “be used to + V-ing”."}, {"no": 21, "q": "Nana often cries when she is worried.", "prompt": "Nana ______________________________ when she is worried.", "answer": "Nana is used to crying when she is worried.", "structure": "be used to + V-ing", "explanation": "“often + V” có thể diễn đạt bằng “be used to + V-ing” trong ngữ cảnh thói quen."}, {"no": 22, "q": "This is the first time I have eaten sushi.", "prompt": "I am ______________________________ sushi.", "answer": "I am not used to eating sushi.", "structure": "be not used to + V-ing", "explanation": "“This is the first time...” theo tài liệu được luyện lại với “be not used to + V-ing”."}, {"no": 23, "q": "I would prefer to stay at home.", "prompt": "I would rather ______________________________.", "answer": "I would rather stay at home.", "structure": "would rather + V", "explanation": "“would prefer to V” có thể đổi thành “would rather V”."}, {"no": 24, "q": "I prefer going shopping to playing volleyball.", "prompt": "I would rather ______________________________.", "answer": "I would rather go shopping than play volleyball.", "structure": "would rather + V + than + V", "explanation": "“prefer V-ing to V-ing” có thể đổi thành “would rather V than V”."}, {"no": 25, "q": "People find it difficult to learn this language.", "prompt": "People ______________________________ this language.", "answer": "People find it difficult to learn this language.", "structure": "find + it + adjective + to V", "explanation": "Cấu trúc “find + it + adjective + to V” dùng để đánh giá một việc là khó, dễ, quan trọng..."}, {"no": 26, "q": "Learning English is important.", "prompt": "It is ______________________________.", "answer": "It is important to learn English.", "structure": "It + be + adjective + to V", "explanation": "“To V + be + adjective” có thể đổi thành “It + be + adjective + to V”."}, {"no": 27, "q": "It is your duty to finish the report.", "prompt": "You ______________________________ the report.", "answer": "You are supposed to finish the report.", "structure": "be supposed to + V", "explanation": "“It is one’s duty to V” tương đương “S + be supposed to V”."}, {"no": 28, "q": "The students are expected to arrive at 7.", "prompt": "The students ______________________________ at 7.", "answer": "The students are supposed to arrive at 7.", "structure": "be supposed to + V", "explanation": "“be + V3 + to V” theo tài liệu có thể chuyển sang “be supposed to V”."}, {"no": 29, "q": "Close the door.", "prompt": "The door ______________________________.", "answer": "The door should be closed.", "structure": "should + be + V3", "explanation": "Mệnh lệnh có thể đổi sang bị động với “should be + V3”."}, {"no": 30, "q": "Don’t use your phone in class.", "prompt": "You ______________________________ your phone in class.", "answer": "You should not use your phone in class.", "structure": "should not + V", "explanation": "Mệnh lệnh phủ định có thể đổi thành “should not + V”."}, {"no": 31, "q": "I like collecting stamps.", "prompt": "I am ______________________________.", "answer": "I am fond of collecting stamps.", "structure": "be fond of + V-ing", "explanation": "“like” có thể đổi thành “be fond of + V-ing”."}, {"no": 32, "q": "My boss let me leave early.", "prompt": "My boss ______________________________ early.", "answer": "My boss allowed me to leave early.", "structure": "allow + object + to V", "explanation": "“let + O + V” có thể đổi thành “allow + O + to V”."}, {"no": 33, "q": "She once lived in London.", "prompt": "She ______________________________ in London.", "answer": "She would live in London.", "structure": "would + V (past habit)", "explanation": "Theo tài liệu, thói quen trong quá khứ có thể diễn đạt bằng “would + V”."}, {"no": 34, "q": "He doesn’t smoke anymore.", "prompt": "He ______________________________.", "answer": "He would smoke.", "structure": "would + V (past habit)", "explanation": "Theo tài liệu, một thói quen trong quá khứ có thể diễn đạt bằng “would + V”."}, {"no": 35, "q": "She studies hard because she wants to pass.", "prompt": "She studies hard ______________________________.", "answer": "She studies hard to pass.", "structure": "to-infinitive of purpose", "explanation": "Mệnh đề chỉ mục đích với “because + S + V” có thể rút gọn thành “to + V” khi chủ ngữ phù hợp."}, {"no": 36, "q": "He saved money so that he could buy a car.", "prompt": "He saved money ______________________________ a car.", "answer": "He saved money to buy a car.", "structure": "to-infinitive of purpose", "explanation": "“so that/in order that + S + V” có thể đổi thành “to + V” khi diễn đạt mục đích."}, {"no": 37, "q": "To travel alone is exciting.", "prompt": "It is ______________________________ alone.", "answer": "It is exciting to travel alone.", "structure": "It + be + adjective + to V", "explanation": "“To V + be + adjective” → “It + be + adjective + to V”."}, {"no": 38, "q": "Tom sings and dances.", "prompt": "Tom ______________________________.", "answer": "Tom both sings and dances.", "structure": "both ... and", "explanation": "Hai hành động/tính chất có thể nối bằng “both ... and”."}, {"no": 39, "q": "She can speak English and French.", "prompt": "She can speak ______________________________.", "answer": "She can speak both English and French.", "structure": "both ... and", "explanation": "Dùng “both ... and” để nối hai thành phần tương đương."}, {"no": 40, "q": "He translated fast and correctly.", "prompt": "He translated ______________________________.", "answer": "He translated not only fast but also correctly.", "structure": "not only ... but also", "explanation": "“not only ... but also” nhấn mạnh hai thành phần cùng đúng."}, {"no": 41, "q": "She is both intelligent and hardworking.", "prompt": "She is ______________________________.", "answer": "She is not only intelligent but also hardworking.", "structure": "not only ... but also", "explanation": "“both ... and” có thể đổi thành “not only ... but also”."}, {"no": 42, "q": "You study hard and you will pass the exam.", "prompt": "If ______________________________, you will pass the exam.", "answer": "If you study hard, you will pass the exam.", "structure": "First conditional: if + present, will + V", "explanation": "Câu điều kiện loại 1: If + hiện tại đơn, mệnh đề chính + will + V."}, {"no": 43, "q": "He didn’t work hard, so he failed the exam.", "prompt": "If ______________________________, he would have passed the exam.", "answer": "If he had worked hard, he would have passed the exam.", "structure": "Third conditional", "explanation": "Câu điều kiện loại 3 dùng “if + had + V3” và “would have + V3” cho tình huống trái với quá khứ."}, {"no": 44, "q": "I don’t have enough money, so I can’t buy it.", "prompt": "If ______________________________, I could buy it.", "answer": "If I had enough money, I could buy it.", "structure": "Second conditional", "explanation": "Câu điều kiện loại 2 diễn tả tình huống không có thật/khó xảy ra ở hiện tại."}, {"no": 45, "q": "You won’t pass if you don’t study.", "prompt": "You won’t pass ______________________________.", "answer": "You won’t pass unless you study.", "structure": "unless + affirmative clause", "explanation": "“if + phủ định” có thể đổi thành “unless + khẳng định”."}, {"no": 46, "q": "If you don’t hurry, you will miss the bus.", "prompt": "You will miss the bus ______________________________.", "answer": "You will miss the bus unless you hurry.", "structure": "unless + affirmative clause", "explanation": "“unless” mang nghĩa “if ... not”, nên mệnh đề sau unless dùng dạng khẳng định."}, {"no": 47, "q": "I met a girl. She won the competition.", "prompt": "The girl ______________________________ won the competition.", "answer": "The girl who I met won the competition.", "structure": "relative pronoun who", "explanation": "“who” dùng cho người trong mệnh đề quan hệ."}, {"no": 48, "q": "This is the school. I studied there.", "prompt": "This is the school ______________________________.", "answer": "This is the school where I studied.", "structure": "relative adverb where", "explanation": "“where” dùng cho nơi chốn trong mệnh đề quan hệ."}, {"no": 49, "q": "I met the man. You talked to him yesterday.", "prompt": "I met the man ______________________________ yesterday.", "answer": "I met the man whom you talked to yesterday.", "structure": "whom", "explanation": "“whom” dùng cho người làm tân ngữ trong mệnh đề quan hệ."}, {"no": 50, "q": "This is the book. I bought it yesterday.", "prompt": "This is the book ______________________________ yesterday.", "answer": "This is the book which I bought yesterday.", "structure": "which", "explanation": "“which” dùng cho vật trong mệnh đề quan hệ."}, {"no": 51, "q": "The car is very expensive. My father bought it.", "prompt": "The car ______________________________ is very expensive.", "answer": "The car that my father bought is very expensive.", "structure": "that", "explanation": "“that” có thể dùng cho người hoặc vật trong mệnh đề quan hệ xác định."}, {"no": 52, "q": "She is scared of spiders.", "prompt": "She is ______________________________ spiders.", "answer": "She is afraid of spiders.", "structure": "be afraid of", "explanation": "“scared of” và “afraid of” có nghĩa tương đương."}, {"no": 53, "q": "Let’s go for a walk.", "prompt": "She suggested ______________________________.", "answer": "She suggested that we go for a walk.", "structure": "suggest that + subject + base verb", "explanation": "“Let’s + V” có thể đổi thành “suggest that + subject + base verb”."}, {"no": 54, "q": "In my opinion, we should leave now.", "prompt": "I suggest ______________________________ now.", "answer": "I suggest that we leave now.", "structure": "suggest that + subject + base verb", "explanation": "Theo mẫu trong tài liệu, ý kiến/đề xuất có thể diễn đạt bằng “suggest that + subject + base verb”."}, {"no": 55, "q": "The doctor advised me to rest.", "prompt": "The doctor suggested ______________________________.", "answer": "The doctor suggested that I rest.", "structure": "suggest that + subject + base verb", "explanation": "“advise” có thể chuyển sang “suggest that + subject + base verb”."}, {"no": 56, "q": "Why don’t you join the club?", "prompt": "I suggest ______________________________ the club.", "answer": "I suggest that you join the club.", "structure": "suggest that + subject + base verb", "explanation": "“Why don’t you...?” có thể chuyển thành một lời đề nghị với “suggest that...”."}, {"no": 57, "q": "She gets him to clean the room.", "prompt": "She ______________________________ the room.", "answer": "She has him clean the room.", "structure": "have + object + bare infinitive", "explanation": "“get + O + to V” có thể đổi thành “have + O + V”."}, {"no": 58, "q": "The police asked him to open the door.", "prompt": "The police ______________________________ the door.", "answer": "The police had him open the door.", "structure": "have + object + bare infinitive", "explanation": "“ask + O + to V” theo mẫu tài liệu được đổi thành “have + O + V”."}, {"no": 59, "q": "The teacher requested students to submit the work.", "prompt": "The teacher ______________________________ the work.", "answer": "The teacher had students submit the work.", "structure": "have + object + bare infinitive", "explanation": "“request + O + to V” theo mẫu tài liệu được đổi thành “have + O + V”."}, {"no": 60, "q": "I want her to call me.", "prompt": "I ______________________________ me.", "answer": "I have her call me.", "structure": "have + object + bare infinitive", "explanation": "“want + O + to V” theo mẫu tài liệu được đổi thành “have + O + V”."}, {"no": 61, "q": "She has no care when she speaks.", "prompt": "She is ______________________________ when she speaks.", "answer": "She is careless when she speaks.", "structure": "noun + -less / adjective", "explanation": "Danh từ + “-less” có thể tạo tính từ mang nghĩa “không có...”."}, {"no": 62, "q": "It is necessary that you study regularly.", "prompt": "It is ______________________________ regularly.", "answer": "It is necessary to study regularly.", "structure": "adjective + to-infinitive", "explanation": "“It is + adjective + that + S + V” có thể rút gọn thành “It is + adjective + to V” khi chủ thể phù hợp."}, {"no": 63, "q": "My students are good at Mathematics.", "prompt": "My students ______________________________.", "answer": "My students study Mathematics well.", "structure": "adjective + prep → verb + adverb", "explanation": "Có thể chuyển “be + adjective + preposition” sang động từ + trạng từ tương đương."}, {"no": 64, "q": "I remember to call him tomorrow.", "prompt": "I ______________________________ him tomorrow.", "answer": "I don’t forget to call him tomorrow.", "structure": "remember to V = don't forget to V", "explanation": "“remember to V” có thể diễn đạt bằng “don’t forget to V”."}, {"no": 65, "q": "It was an interesting film.", "prompt": "What ______________________________!", "answer": "What an interesting film!", "structure": "What + a/an + adjective + noun!", "explanation": "“It is/was + adjective + noun” có thể đổi thành “What + a/an + adjective + noun!”."}, {"no": 66, "q": "She speaks English fluently.", "prompt": "How ______________________________!", "answer": "How fluently she speaks English!", "structure": "How + adverb + subject + verb", "explanation": "Cấu trúc cảm thán với trạng từ: “How + adverb + subject + verb!”."}, {"no": 67, "q": "The movie was exciting.", "prompt": "The audience was ______________________________.", "answer": "The audience was excited.", "structure": "-ing adjective → -ed adjective", "explanation": "Tính từ đuôi -ing mô tả sự vật gây cảm xúc; -ed mô tả người cảm nhận cảm xúc."}, {"no": 68, "q": "The news surprised me.", "prompt": "I was ______________________________ the news.", "answer": "I was surprised by the news.", "structure": "verb → be + past participle adjective", "explanation": "Động từ có thể chuyển sang “be + V3” để diễn đạt trạng thái bị tác động."}, {"no": 69, "q": "She learned English for five years.", "prompt": "It ______________________________ English.", "answer": "It took her five years to learn English.", "structure": "It takes + object + time + to V", "explanation": "“S + V + time” có thể đổi thành “It takes + object + time + to V”."}, {"no": 70, "q": "The water is too hot for Peter to drink.", "prompt": "The water is ______________________________.", "answer": "The water is so hot that Peter can’t drink it.", "structure": "so + adjective + that + cannot", "explanation": "“too + adjective + for O + to V” có thể đổi thành “so + adjective + that + O + can’t V”."}, {"no": 71, "q": "He ran too slowly to catch the bus.", "prompt": "He ran ______________________________ the bus.", "answer": "He ran so slowly that he couldn’t catch the bus.", "structure": "so + adverb + that + cannot", "explanation": "“too + adverb + to V” có thể đổi thành “so + adverb + that + S + can’t V”."}, {"no": 72, "q": "The bag is so heavy that I can’t lift it.", "prompt": "The bag is ______________________________.", "answer": "The bag is not light enough for me to lift.", "structure": "not + adjective + enough + to V", "explanation": "“so + adjective + that + cannot” có thể đổi thành “not + adjective + enough + to V”."}, {"no": 73, "q": "The water is too cold to swim in.", "prompt": "The water is ______________________________.", "answer": "The water is not warm enough to swim in.", "structure": "not + adjective + enough + to V", "explanation": "“too + adjective + to V” có thể đổi thành “not + adjective + enough + to V”."}, {"no": 74, "q": "He speaks so softly that I can’t hear him.", "prompt": "He speaks ______________________________ hear him.", "answer": "He speaks too softly for me to hear him.", "structure": "too + adverb + for + object + to V", "explanation": "“too + adverb + for O + to V” diễn tả mức độ quá... khiến ai không thể làm gì."}, {"no": 75, "q": "Because she was absent, she missed the meeting.", "prompt": "Because of ______________________________, she missed the meeting.", "answer": "Because of her absence, she missed the meeting.", "structure": "because of + noun", "explanation": "“Because + clause” có thể đổi thành “because of + noun/noun phrase”."}, {"no": 76, "q": "Look at the picture.", "prompt": "Have ______________________________ the picture.", "answer": "Have a let idx=0,total=0,checked=false;
const app=document.getElementById('app'),progress=document.getElementById('progress'),score=document.getElementById('score');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function norm(s){return s.toLowerCase().trim().replace(/[’`]/g,"'").replace(/\s+/g,' ').replace(/\s+([,.!?])/g,'$1').replace(/[.]+$/,'')}
function render(){
 checked=false;
 let q=qs[idx];
 progress.textContent=`Question ${idx+1} of ${qs.length}`;
 score.textContent=`Score: ${total} / ${qs.length}`;
 app.innerHTML=`<div class="card"><div class="badge">Structure ${q.no}</div>
 <div class="label">Original sentence</div><div class="original">${esc(q.q)}</div>
 <div class="label">Rewrite</div><div class="prompt">${esc(q.prompt)}</div>
 <textarea id="answer" placeholder="Write your complete sentence here..."></textarea>
 <div class="actions"><button class="check" onclick="checkAnswer()">Check Answer</button><button class="next" id="next" disabled onclick="nextQuestion()">Next</button></div>
 <div id="feedback" class="feedback"></div></div>`;
 document.getElementById('answer').focus();
}
function checkAnswer(){
 if(checked)return;
 let input=document.getElementById('answer').value.trim();
 if(!input)return;
 checked=true;
 let q=qs[idx],ok=norm(input)===norm(q.answer),fb=document.getElementById('feedback');
 fb.className='feedback '+(ok?'correct':'wrong');
 fb.innerHTML=(ok?'<strong>✓ Correct!</strong>':'<strong>✗ Incorrect.</strong>')+
 `<div class="answer">Correct answer: ${esc(q.answer)}</div><div class="structure">Structure: ${esc(q.structure)}</div>
 <div class="explain"><strong>Explanation:</strong> ${esc(q.explanation)}</div>`;
 if(ok)total++;
 score.textContent=`Score: ${total} / ${qs.length}`;
 document.getElementById('answer').disabled=true;
 document.getElementById('next').disabled=false;
}
function nextQuestion(){
 idx++;
 if(idx>=qs.length){
   progress.textContent='Complete';
   score.textContent=`Score: ${total} / ${qs.length}`;
   app.innerHTML=`<div class="summary"><h2>Practice Complete!</h2><div class="big">${total} / ${qs.length}</div><p>Your score: <strong>${Math.round(total/qs.length*100)}%</strong></p><button class="restart" onclick="location.reload()">Practise Again</button></div>`;
   return;
 }
 render();
}
